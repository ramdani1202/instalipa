<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="instalipa">
<meta name="theme-color" content="#e6e8f6">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>instalipa</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #e6e8f6; }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
         color: #111; -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
  button { font-family: inherit; cursor: pointer; outline: none; }
  svg { width: 100%; height: 100%; display: block; }

  .bg { position: fixed; left: 0; top: 0; right: 0; bottom: 0;
        background: linear-gradient(160deg, #e3e8f8 0%, #ebe6f8 55%, #e2e6f6 100%); }
  .app { position: fixed; left: 0; top: 0; right: 0; bottom: 0; padding: 12px; }
  .card { position: relative; width: 100%; height: 100%; border-radius: 34px; overflow: hidden;
          background: linear-gradient(180deg, #f8faff 0%, #eef1fb 100%);
          box-shadow: 0 24px 60px rgba(110,110,180,.25), inset 0 1px 0 rgba(255,255,255,.9);
          -webkit-mask-image: -webkit-radial-gradient(white, black); }
  .card:before { content: ""; position: absolute; left: -45%; top: 28%; width: 130%; height: 52%;
          background: radial-gradient(closest-side, rgba(255,224,182,.5), rgba(255,224,182,0));
          pointer-events: none; }

  .screen { position: absolute; left: 0; top: 0; right: 0; bottom: 0;
            transition: transform .7s cubic-bezier(.4,0,.2,1), opacity .6s ease; }

  /* ---------- LANDING ---------- */
  #landing.hide { transform: translate3d(0,-7%,0); opacity: 0; pointer-events: none; }
  #landing.hide * { animation-play-state: paused !important; }

  .discs { position: absolute; left: 0; right: 0; top: 24px; height: 140px; }
  .disc { position: absolute; top: 0; width: 132px; height: 132px; border-radius: 50%;
          box-shadow: 0 10px 26px rgba(110,115,170,.22), inset 0 0 0 1px rgba(255,255,255,.9); }
  .disc.d1 { left: 28px; z-index: 1;
          background: radial-gradient(circle, #fff 0, #fff 12%, rgba(255,255,255,0) 13%),
                      repeating-radial-gradient(circle, rgba(228,232,243,.96) 0, rgba(244,246,251,.96) 3px, rgba(224,228,241,.96) 6px);
          animation: slideL .9s .05s cubic-bezier(.2,.8,.2,1) both, floatY 6.5s 1s ease-in-out infinite; }
  .disc.d2 { left: 112px; z-index: 2;
          background: radial-gradient(circle, #fff 0, #fff 12%, rgba(255,255,255,0) 13%),
                      repeating-radial-gradient(circle, rgba(232,236,246,.97) 0, rgba(246,247,252,.97) 3px, rgba(226,230,243,.97) 6px);
          animation: slideL .9s .2s cubic-bezier(.2,.8,.2,1) both, floatY2 7s 1.1s ease-in-out infinite; }
  .disc.d3 { left: 196px; z-index: 3; overflow: hidden;
          background: radial-gradient(circle, #fff 0, #fff 7%, #c8cde3 8%, #c8cde3 10%, rgba(255,255,255,0) 11%),
                      repeating-radial-gradient(circle, #e9ecf5 0, #cfd5ec 2px, #f6eefb 4px, #d6e6f3 7px);
          animation: slideL .9s .35s cubic-bezier(.2,.8,.2,1) both, floatY 7.5s 1.2s ease-in-out infinite; }
  .disc.d3 .sheen { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 50%;
          background: linear-gradient(115deg, rgba(255,255,255,0) 18%, rgba(255,255,255,.9) 40%,
                      rgba(130,200,255,.35) 50%, rgba(255,160,220,.32) 60%, rgba(255,255,255,0) 82%);
          animation: spin 9s linear infinite; }
  .disc .lbl { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px;
          border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(200,205,225,.7); }
  .disc .lbl:before, .disc .lbl:after { content: ""; position: absolute; left: 9px; right: 9px; height: 2px;
          background: #c7cbdc; border-radius: 1px; }
  .disc .lbl:before { top: 14px; } .disc .lbl:after { top: 19px; right: 14px; }
  .disc.d3 .lbl { display: none; }

  .cs-wrap { position: absolute; left: 47%; top: 43%; width: 235px; height: 142px;
             animation: slideIn 1s .45s cubic-bezier(.2,.8,.2,1) both; }
  .cassette { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 12px;
              background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(226,231,246,.85));
              border: 1px solid rgba(255,255,255,.95);
              box-shadow: 0 16px 34px rgba(120,125,185,.28);
              -webkit-mask-image: -webkit-linear-gradient(left, #000 42%, rgba(0,0,0,0) 100%);
              animation: floatY 6s 1.4s ease-in-out infinite; }
  .cs-top { position: absolute; left: 12px; right: 12px; top: 12px; height: 28px; border-radius: 4px;
            background: rgba(255,255,255,.85); display: flex; align-items: center; padding: 0 9px;
            font-size: 9px; color: #666; letter-spacing: .3px; }
  .cs-top b { font-size: 17px; color: #111; margin-right: 8px; }
  .cs-win { position: absolute; left: 44px; right: 44px; top: 52px; height: 56px; border-radius: 28px;
            background: rgba(200,207,229,.6); box-shadow: inset 0 2px 6px rgba(120,125,170,.25); }
  .reel { position: absolute; top: 6px; width: 44px; height: 44px; border-radius: 50%;
          background: #e9ecf6; border: 7px dotted #fff; animation: spin 4s linear infinite; }
  .reel.r1 { left: 8px; } .reel.r2 { right: 8px; }
  .cs-90 { position: absolute; left: 16px; bottom: 12px; width: 24px; height: 24px; border-radius: 50%;
           border: 1px solid #b9bdd0; font-size: 9px; text-align: center; line-height: 22px; color: #666; background: #fff; }

  .hero { position: absolute; left: 26px; bottom: 98px; font-size: 42px; line-height: 1.06; font-weight: 800;
          letter-spacing: -1.4px; }
  .hero span { display: block; opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) forwards; }
  .hero span:nth-child(1) { animation-delay: .35s; }
  .hero span:nth-child(2) { animation-delay: .5s; color: #9c9eab; }
  .hero span:nth-child(3) { animation-delay: .65s; }
  #start { position: absolute; left: 16px; right: 16px; bottom: 22px; height: 52px; border: 0; border-radius: 26px;
           font-size: 16px; font-weight: 700; color: #111;
           background: linear-gradient(180deg, #fff, #eef0f9);
           box-shadow: 0 8px 22px rgba(110,115,175,.28), inset 0 0 0 1px rgba(255,255,255,.95);
           opacity: 0; animation: up .8s .85s cubic-bezier(.2,.8,.2,1) forwards; }
  #start:active { -webkit-transform: scale(.98); transform: scale(.98); }

  /* ---------- EXPLORE ---------- */
  #explore { opacity: 0; transform: translate3d(0,5%,0); pointer-events: none; }
  #explore.show { opacity: 1; transform: none; pointer-events: auto; }
  .hdr { position: absolute; left: 0; right: 0; top: 0; height: 68px; display: flex; align-items: center;
         justify-content: space-between; padding: 6px 18px 0 24px; z-index: 5; }
  .hdr h2 { margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -.5px; }
  #net { display: none; margin-left: 10px; font-size: 11px; font-weight: 600; color: #8d8fa0;
         background: #e6e8f4; border-radius: 9px; padding: 3px 8px; vertical-align: 3px; }
  #net.on { display: inline-block; }
  #menuBtn, #addBtn { width: 38px; height: 38px; padding: 7px; border: 0; background: none; color: #111; }

  #list { position: absolute; left: 0; right: 0; top: 106px; bottom: 74px; overflow: hidden; }
  #rows { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  .fade-t, .fade-b { position: absolute; left: 0; right: 0; height: 46px; pointer-events: none; z-index: 3; }
  .fade-t { top: 0; background: linear-gradient(to bottom, rgba(246,248,254,.95), rgba(246,248,254,0)); }
  .fade-b { bottom: 0; background: linear-gradient(to top, rgba(242,244,252,.95), rgba(242,244,252,0)); }
  #empty { position: absolute; left: 30px; right: 30px; top: 40%; text-align: center; color: #8d8fa0;
           font-size: 14px; line-height: 1.5; display: none; }

  .row { position: absolute; left: 0; top: 0; width: 100%; height: 72px; will-change: transform; }
  .pill { position: absolute; left: 10px; right: 10px; top: 0; bottom: 0; border-radius: 36px; background: #fff;
          box-shadow: 0 10px 28px rgba(110,115,175,.2), inset 0 0 0 1px rgba(255,255,255,.9); opacity: 0; }
  .grp { position: absolute; left: 24px; top: 0; height: 72px; display: flex; align-items: center;
         -webkit-transform-origin: 0 50%; transform-origin: 0 50%; will-change: transform, opacity; }
  .cover { width: 56px; height: 56px; border-radius: 50%; flex: none; display: flex; align-items: center;
           justify-content: center; font-size: 22px; font-weight: 800; color: #fff; background-color: #888;
           box-shadow: 0 5px 14px rgba(70,70,120,.28), inset 0 0 0 2px rgba(255,255,255,.35); }
  .txt { margin-left: 14px; max-width: 150px; -webkit-transform-origin: 0 50%; transform-origin: 0 50%; }
  .t { font-size: 17px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; overflow: hidden;
       text-overflow: ellipsis; }
  .a { font-size: 13px; color: #8d8fa0; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .play { position: absolute; right: 22px; top: 19px; height: 34px; padding: 0 17px; border: 0; border-radius: 17px;
          background: linear-gradient(180deg, #fff, #eef0f8); font-size: 13px; font-weight: 600; color: #111;
          box-shadow: 0 3px 8px rgba(110,115,175,.28), inset 0 0 0 1px rgba(255,255,255,.95); opacity: 0; }

  /* ---------- TAB BAR & MINI PLAYER ---------- */
  #tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; display: flex; z-index: 10;
            background: linear-gradient(to top, #f3f5fd 62%, rgba(243,245,253,0));
            opacity: 0; transform: translate3d(0,100%,0); pointer-events: none;
            transition: transform .6s cubic-bezier(.2,.8,.2,1), opacity .5s; }
  #tabbar.show { opacity: 1; transform: none; pointer-events: auto; }
  .tab { flex: 1; border: 0; background: none; color: #a0a2b3; padding: 22px 0 0; transition: color .25s; }
  .tab i { display: block; width: 26px; height: 26px; margin: 0 auto; transition: transform .25s; }
  .tab.on { color: #111; } .tab.on i { transform: scale(1.12); }

  #mini { position: absolute; left: 14px; right: 14px; bottom: 80px; height: 58px; border-radius: 29px; z-index: 12;
          background: #fff; display: flex; align-items: center; padding: 0 8px;
          box-shadow: 0 12px 30px rgba(100,105,170,.28);
          transform: translate3d(0,180%,0); opacity: 0; pointer-events: none;
          transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .35s; }
  #mini.on { transform: none; opacity: 1; pointer-events: auto; }
  #miniCover { width: 42px; height: 42px; border-radius: 50%; flex: none; font-size: 17px; }
  #miniInfo { flex: 1; min-width: 0; margin-left: 12px; }
  #miniTitle { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #miniSub { font-size: 12px; color: #8d8fa0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  #miniBtn { width: 42px; height: 42px; border: 0; border-radius: 50%; background: #111; color: #fff; padding: 11px;
             flex: none; }

  /* ---------- NOW PLAYING ---------- */
  #sheet { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 30;
           background: linear-gradient(180deg, #f8faff 0%, #eceff9 100%);
           transform: translate3d(0,102%,0); transition: transform .55s cubic-bezier(.2,.8,.2,1); }
  #sheet.open { transform: none; }
  .sbar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 6px 14px 0; }
  .sbar span { font-size: 13px; font-weight: 600; color: #8d8fa0; letter-spacing: .3px; }
  #sheetClose { width: 40px; height: 40px; padding: 8px; border: 0; background: none; color: #111; }
  .sbar i { width: 40px; display: block; }
  .vinyl { position: relative; width: 236px; height: 236px; border-radius: 50%; margin: 6px auto 0; background: #121214;
           box-shadow: 0 26px 50px rgba(80,85,150,.35); animation: spin 14s linear infinite; animation-play-state: paused; }
  .vinyl.playing { animation-play-state: running; }
  .vinyl .grv { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 50%;
                background: repeating-radial-gradient(circle, rgba(255,255,255,.07) 0, rgba(255,255,255,.07) 1px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 4px); }
  .vinyl .shn { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 50%;
                background: linear-gradient(120deg, rgba(255,255,255,.22) 0, rgba(255,255,255,0) 28%, rgba(255,255,255,0) 62%, rgba(255,255,255,.14) 100%); }
  #vLab { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 800; color: #fff;
          box-shadow: 0 0 0 4px rgba(255,255,255,.12); }
  .vinyl .hole { position: absolute; left: 50%; top: 50%; width: 11px; height: 11px; margin: -5px 0 0 -5px;
                 border-radius: 50%; background: #eef1fb; }
  #sTitle { text-align: center; font-size: 24px; font-weight: 800; letter-spacing: -.5px; margin: 26px 28px 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sArtist { text-align: center; font-size: 15px; color: #8d8fa0; min-height: 20px; }
  .seekrow { display: flex; align-items: center; margin: 22px 26px 0; font-size: 12px; color: #8d8fa0; }
  .seekrow span { width: 38px; text-align: center; }
  #seek { -webkit-appearance: none; appearance: none; flex: 1; height: 5px; border-radius: 3px; background: #d8dbec;
          outline: none; margin: 0; }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%; background: #111;
          box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .ctrls { display: flex; align-items: center; justify-content: center; margin-top: 20px; }
  .ctrls button { border: 0; background: none; color: #111; width: 50px; height: 50px; padding: 13px; margin: 0 5px; }
  .ctrls button.sm { color: #a0a2b3; width: 44px; height: 44px; padding: 11px; }
  .ctrls button.sm.on { color: #ff375f; }
  .ctrls button.sm { position: relative; }
  #bRepeat.one::after { content: "1"; position: absolute; right: 7px; top: 6px; font-size: 11px; font-weight: 800; line-height: 1; }
  .ctrls button#bPlay { width: 72px; height: 72px; padding: 20px; background: #111; color: #fff; border-radius: 50%;
          box-shadow: 0 12px 26px rgba(20,20,40,.35); }
  .ctrls button:active { opacity: .7; }
  #bSave { display: flex; align-items: center; justify-content: center; margin: 22px auto 0; height: 40px; padding: 0 18px;
           border: 0; border-radius: 20px; background: #fff; color: #111; font-size: 13px; font-weight: 600;
           box-shadow: 0 6px 16px rgba(110,115,175,.25); }
  #bSave i { width: 18px; height: 18px; margin-right: 7px; display: block; }
  #bSave.saved { color: #1fa84f; } #bSave.busy { opacity: .55; }
  #saveNote { text-align: center; font-size: 11px; color: #a0a2b3; margin-top: 8px; min-height: 14px; }

  /* ---------- MENU & TOAST ---------- */
  #menuWrap { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 40; display: none; }
  #menuWrap.on { display: block; }
  #menu { position: absolute; right: 14px; top: 60px; width: 220px; background: #fff; border-radius: 18px; padding: 6px 0;
          box-shadow: 0 16px 40px rgba(90,95,160,.35); -webkit-transform-origin: 100% 0; transform-origin: 100% 0;
          animation: pop .25s cubic-bezier(.2,.8,.2,1); }
  #menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 13px 18px;
                 font-size: 15px; font-weight: 500; color: #111; }
  #menu button:active { background: #f0f2fa; }
  #toast { position: absolute; left: 24px; right: 24px; bottom: 150px; z-index: 50; text-align: center; font-size: 13px;
           color: #fff; background: rgba(20,20,30,.86); border-radius: 16px; padding: 10px 14px;
           opacity: 0; transform: translate3d(0,12px,0); pointer-events: none; transition: opacity .3s, transform .3s; }
  #toast.on { opacity: 1; transform: none; }

  #a2hs { position: absolute; left: 14px; right: 14px; top: 12px; z-index: 60; display: none; align-items: center;
          background: rgba(255,255,255,.96); border-radius: 22px; padding: 8px 8px 8px 16px;
          box-shadow: 0 10px 28px rgba(100,105,170,.3); font-size: 13px; line-height: 1.3; color: #111;
          animation: drop .6s 1.2s cubic-bezier(.2,.8,.2,1) both; }
  #a2hs.on { display: flex; }
  #a2hsTxt { flex: 1; font-weight: 600; }
  #a2hsBtn { border: 0; background: #111; color: #fff; border-radius: 16px; height: 32px; padding: 0 14px;
             font-size: 13px; font-weight: 700; margin-left: 8px; }
  #a2hsProfile { display: none; border: 0; background: #111; color: #fff; border-radius: 16px; height: 32px; padding: 0 14px;
             font-size: 13px; font-weight: 700; margin-left: 8px; white-space: nowrap; }
  #a2hsX { border: 0; background: none; color: #8d8fa0; font-size: 22px; width: 32px; height: 32px; line-height: 1; }
  #arrow { position: fixed; left: 50%; bottom: 4px; margin-left: -16px; width: 32px; height: 32px; z-index: 99;
           display: none; color: #ff375f; animation: bounce 1s ease-in-out infinite; }
  #arrow.on { display: block; }
  #xfer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 70; display: none;
          background: rgba(24,26,48,.38); align-items: center; justify-content: center; }
  #xfer.on { display: flex; animation: fade .25s ease both; }
  .xbox { width: 86%; max-width: 340px; background: #fff; border-radius: 26px; padding: 22px 20px 18px; text-align: center;
          box-shadow: 0 24px 60px rgba(60,65,130,.4); animation: pop .3s cubic-bezier(.2,.8,.2,1); }
  .xbox h3 { margin: 0 0 6px; font-size: 20px; font-weight: 800; letter-spacing: -.4px; }
  #xText { font-size: 13px; color: #8d8fa0; line-height: 1.4; margin-bottom: 12px; }
  #xCode { display: none; font-size: 46px; font-weight: 800; letter-spacing: 9px; padding-left: 9px; margin: 4px 0 10px; color: #111; }
  #xSendForm { display: none; }
  .xbtn { display: block; width: 100%; height: 44px; border: 0; border-radius: 22px; background: #eef0f8; color: #111;
          font-size: 14px; font-weight: 700; margin-top: 8px; }
  .xbtn.dark { background: #111; color: #fff; }
  #xPicked { font-size: 12px; color: #8d8fa0; margin: 8px 0 2px; }
  #xCodeIn { width: 100%; height: 48px; border: 0; border-radius: 14px; background: #f1f3fa; text-align: center;
             font-size: 24px; font-weight: 700; letter-spacing: 6px; margin-top: 8px; outline: none; color: #111;
             -webkit-user-select: text; user-select: text; }
  #xProg { display: none; height: 6px; border-radius: 3px; background: #e3e6f3; margin: 14px 4px 0; overflow: hidden; }
  #xBar { display: block; height: 100%; width: 0; background: #111; border-radius: 3px; transition: width .2s linear; }
  #xStatus { font-size: 13px; color: #555; min-height: 18px; margin-top: 12px; line-height: 1.4; }
  #chips { position: absolute; left: 0; right: 0; top: 62px; height: 40px; display: flex; padding: 0 20px; z-index: 5; }
  .chip { border: 0; background: #e8ebf6; color: #6c6e80; border-radius: 16px; height: 32px; padding: 0 14px;
          margin-right: 8px; font-size: 13px; font-weight: 700; transition: background .25s, color .25s; }
  .chip.on { background: #111; color: #fff; }

  .card.nomask { -webkit-mask-image: none; }
  #viewer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 45; background: #0b0b10;
            visibility: hidden; opacity: 0; transition: opacity .3s, visibility 0s .3s; }
  #viewer.on { visibility: visible; opacity: 1; transition: opacity .3s; }
  .vbar { position: absolute; left: 0; right: 0; top: 0; height: 60px; display: flex; align-items: center;
          padding: 6px 8px 0; z-index: 3; color: #fff; }
  .vbar button { width: 42px; height: 42px; padding: 10px; border: 0; background: none; color: #fff; flex: none; }
  #vvTitle { flex: 1; min-width: 0; text-align: center; font-size: 15px; font-weight: 700; color: #fff;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .vstage { position: absolute; left: 0; right: 0; top: 60px; bottom: 48px; display: flex; align-items: center; justify-content: center; }
  #vvImg { max-width: 100%; max-height: 100%; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
  #vvVid { width: 100%; max-height: 100%; background: #000; }
  .vnav { position: absolute; top: 50%; margin-top: -22px; width: 44px; height: 44px; border: 0; border-radius: 50%;
          background: rgba(255,255,255,.16); color: #fff; padding: 10px; z-index: 3; }
  .vnav.l { left: 8px; } .vnav.r { right: 8px; }
  #vvHint { position: absolute; left: 16px; right: 16px; bottom: 12px; text-align: center; font-size: 12px; color: rgba(255,255,255,.6); }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes drop { from { opacity: 0; transform: translate3d(0,-30px,0); } to { opacity: 1; transform: none; } }
  @keyframes bounce { 0%, 100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(0,-9px,0); } }
  @keyframes up { from { opacity: 0; transform: translate3d(0,22px,0); } to { opacity: 1; transform: none; } }
  @keyframes slideL { from { opacity: 0; transform: translate3d(-50px,0,0) rotate(-50deg); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translate3d(70px,0,0); } to { opacity: 1; transform: none; } }
  @keyframes floatY { 0%, 100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(0,-8px,0); } }
  @keyframes floatY2 { 0%, 100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(0,7px,0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
</style>
</head>

<audio id="audio" preload="metadata"></audio>

<script>
(function () {
  "use strict";

  var CACHE = "musik-v2";
  var hasCache = !!(window.caches && "serviceWorker" in navigator);
  var SP = 80; // jarak antar baris (px)

  function $(id) { return document.getElementById(id); }

  /* ---------- ikon ---------- */
  function S(inner) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>'; }
  function F(inner) { return '<svg viewBox="0 0 24 24" fill="currentColor">' + inner + '</svg>'; }
  var ICON = {
    play: F('<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>'),
    pause: F('<rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/>'),
    next: F('<path d="M5 6.2v11.6a.8.8 0 0 0 1.25.66l8.4-5.8a.8.8 0 0 0 0-1.32l-8.4-5.8A.8.8 0 0 0 5 6.2z"/><rect x="16.5" y="5" width="2.6" height="14" rx="1.1"/>'),
    prev: F('<path d="M19 6.2v11.6a.8.8 0 0 1-1.25.66l-8.4-5.8a.8.8 0 0 1 0-1.32l8.4-5.8A.8.8 0 0 1 19 6.2z"/><rect x="4.9" y="5" width="2.6" height="14" rx="1.1"/>'),
    shuffle: S('<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>'),
    repeat: S('<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>'),
    home: S('<path d="M3 10.5L12 3l9 7.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-7h6v7"/>'),
    planet: S('<circle cx="12" cy="12" r="5.2"/><ellipse cx="12" cy="12" rx="10" ry="3.6" transform="rotate(-24 12 12)"/>'),
    mark: S('<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>'),
    down: S('<polyline points="6 9 12 15 18 9"/>'),
    dots: F('<circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>'),
    dl: S('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'),
    close: S('<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>'),
    left: S('<polyline points="15 5 8 12 15 19"/>'),
    right: S('<polyline points="9 5 16 12 9 19"/>'),
    plus: S('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
    trash: S('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>'),
    check: S('<polyline points="20 6 9 17 4 12"/>')
  };
  (function () {
    var els = document.querySelectorAll("[data-icon]");
    for (var i = 0; i < els.length; i++) els[i].innerHTML = ICON[els[i].getAttribute("data-icon")];
  })();

  /* ---------- elemen ---------- */
  var audio = $("audio"), landing = $("landing"), explore = $("explore"), tabbar = $("tabbar");
  var rowsEl = $("rows"), listEl = $("list"), emptyEl = $("empty"), hdrTitle = $("hdrTitle"), netEl = $("net");
  var mini = $("mini"), miniCover = $("miniCover"), miniTitle = $("miniTitle"), miniSub = $("miniSub"), miniBtn = $("miniBtn");
  var sheet = $("sheet"), vinyl = $("vinyl"), vLab = $("vLab"), sTitle = $("sTitle"), sArtist = $("sArtist");
  var seek = $("seek"), curEl = $("cur"), durEl = $("dur");
  var bShuffle = $("bShuffle"), bRepeat = $("bRepeat"), bPlay = $("bPlay"), bSave = $("bSave");
  var bSaveTxt = $("bSaveTxt"), saveNote = $("saveNote");
  var menuWrap = $("menuWrap"), mShuffle = $("mShuffle"), mRepeat = $("mRepeat"), toastEl = $("toast");

  /* ---------- state ---------- */
  var songs = [];
  var index = -1;            // lagu yang sedang dimuat (index di songs)
  var queue = [];            // urutan putar
  var shuffle = false, repeat = 0;   // repeat: 0 mati, 1 semua lagu, 2 satu lagu terus
  var dragging = false;      // slider seek
  var saved = {}, busy = {};
  var userPaused = false, resumeTime = 0, restoredAt = 0, lastSave = 0, wasPlaying = false;
  var screen = "landing";
  var view = "all";
  var listIdx = [];          // index songs yang tampil di daftar
  var rows = [];
  var db = null, loadToken = 0, urlCache = {}, urlOrder = [];
  var mfilter = "all", vvIdx = -1, vvUrl = null, viewTok = 0;
  var pos = 0, listH = 400, animId = null, drag = null, sheetOpen = false;

  function fmt(s) {
    if (!isFinite(s) || s < 0) return "0:00";
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ":" + (sec < 10 ? "0" : "") + sec;
  }
  function abs(file) { var a = document.createElement("a"); a.href = encodeURI(file); return a.href; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  var toastT;
  function toast(m) {
    toastEl.textContent = m; toastEl.classList.add("on");
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove("on"); }, 2600);
  }

  /* ---------- cover ---------- */
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
  function kindOf(s) { return s.kind || "audio"; }
  function fmtSize(n) {
    if (n >= 1073741824) return (n / 1073741824).toFixed(2) + " GB";
    if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
    return Math.max(1, Math.round(n / 1024)) + " KB";
  }
  function paintCover(el, song, i) {
    var kd = kindOf(song);
    el.style.textShadow = "none";
    if (song.thumb) {
      el.style.backgroundImage = 'url("' + song.thumb + '")';
      el.style.backgroundSize = "cover"; el.style.backgroundPosition = "center";
      el.style.color = "#fff";
      el.style.textShadow = "0 1px 4px rgba(0,0,0,.6)";
      el.textContent = kd === "video" ? "\u25B6\uFE0E" : "";
      return;
    }
    if (song.cover) {
      el.style.backgroundImage = 'url("' + encodeURI(song.cover) + '")';
      el.style.backgroundSize = "cover"; el.style.backgroundPosition = "center";
      el.textContent = ""; return;
    }
    var h = hash((song.title || "") + i) % 360;
    el.style.backgroundSize = "auto";
    if (i % 3 === 1) {
      el.style.backgroundImage = "linear-gradient(135deg,#17171c,#4b4b57)";
      el.style.color = "hsl(" + h + ",90%,72%)";
    } else {
      el.style.backgroundImage = "linear-gradient(135deg,hsl(" + h + ",78%,66%),hsl(" + ((h + 55) % 360) + ",80%,48%))";
      el.style.color = "#fff";
    }
    el.textContent = kd === "video" ? "\u25B6\uFE0E" : (kd === "image" ? "\u25A3" : (song.title || "?").charAt(0).toUpperCase());
  }

  /* ---------- daftar melengkung ---------- */
  function measure() { listH = listEl.clientHeight || 400; }

  function updateRows() {
    var n = rows.length, cy = listH * 0.5;
    for (var k = 0; k < n; k++) {
      var r = rows[k], d = k - pos, ad = d < 0 ? -d : d;
      if (ad > 3.6) {
        if (!r.hid) { r.el.style.display = "none"; r.hid = true; }
        continue;
      }
      if (r.hid) { r.el.style.display = "block"; r.hid = false; }
      var y = cy - 36 + d * SP;
      var x = 16 * Math.pow(ad, 1.9);
      var s = Math.max(0.55, 1 - 0.11 * ad);
      var op = clamp(1 - 0.27 * Math.pow(ad, 1.15), 0, 1);
      var rot = (d < 0 ? 1 : -1) * Math.min(ad, 2) * 10;
      var cl = Math.max(0, 1 - ad * 1.7);
      r.el.style.transform = "translate3d(0," + y.toFixed(1) + "px,0)";
      r.grp.style.transform = "translate3d(" + x.toFixed(1) + "px,0,0) scale(" + s.toFixed(3) + ")";
      r.grp.style.opacity = op.toFixed(3);
      r.txt.style.transform = "rotate(" + rot.toFixed(1) + "deg)";
      r.pill.style.opacity = cl.toFixed(3);
      r.btn.style.opacity = cl.toFixed(3);
    }
  }

  function selK() { return rows.length ? clamp(Math.round(pos), 0, rows.length - 1) : 0; }

  function stopAnim() { if (animId) { cancelAnimationFrame(animId); animId = null; } }
  function animateTo(target, dur) {
    stopAnim();
    var from = pos, t0 = Date.now();
    dur = dur || Math.min(650, 280 + Math.abs(target - from) * 90);
    function step() {
      var p = (Date.now() - t0) / dur;
      if (p >= 1) { pos = target; updateRows(); animId = null; refreshLabels(); prefetchLocal(selK()); return; }
      var e = 1 - Math.pow(1 - p, 3);
      pos = from + (target - from) * e;
      updateRows();
      animId = requestAnimationFrame(step);
    }
    animId = requestAnimationFrame(step);
  }

  function refreshLabels() {
    for (var k = 0; k < rows.length; k++) {
      if (rows[k].kind !== "audio") continue;
      var playing = listIdx[k] === index && !audio.paused;
      var t = playing ? "Pause" : "Play";
      if (rows[k].btn.textContent !== t) rows[k].btn.textContent = t;
    }
  }

  function buildList() {
    listIdx = [];
    for (var i = 0; i < songs.length; i++) {
      var sg = songs[i];
      if ((view === "all" || saved[sg.file]) && (mfilter === "all" || kindOf(sg) === mfilter)) listIdx.push(i);
    }
    rowsEl.innerHTML = "";
    rows = [];
    for (var k = 0; k < listIdx.length; k++) {
      var s = songs[listIdx[k]], kd = kindOf(s);
      var el = document.createElement("div"); el.className = "row"; el.setAttribute("data-k", k);
      var pill = document.createElement("div"); pill.className = "pill";
      var grp = document.createElement("div"); grp.className = "grp";
      var cover = document.createElement("div"); cover.className = "cover";
      paintCover(cover, s, listIdx[k]);
      var txt = document.createElement("div"); txt.className = "txt";
      var t = document.createElement("div"); t.className = "t"; t.textContent = s.title || "";
      var a = document.createElement("div"); a.className = "a";
      a.textContent = kd === "audio" ? (s.artist || "") : (fmtSize(s.size || 0) + " \u00b7 " + (kd === "video" ? "Video" : "Foto"));
      txt.appendChild(t); txt.appendChild(a);
      grp.appendChild(cover); grp.appendChild(txt);
      var btn = document.createElement("button"); btn.className = "play"; btn.textContent = kd === "image" ? "View" : "Play";
      el.appendChild(pill); el.appendChild(grp); el.appendChild(btn);
      rowsEl.appendChild(el);
      rows.push({ el: el, pill: pill, grp: grp, txt: txt, btn: btn, cover: cover, kind: kd, hid: false });
    }
    emptyEl.style.display = rows.length ? "none" : "block";
    var lbl = mfilter === "audio" ? "lagu" : (mfilter === "video" ? "video" : (mfilter === "image" ? "foto" : "file"));
    emptyEl.textContent = view === "saved"
      ? "Belum ada " + lbl + " tersimpan di perangkat."
      : "Belum ada " + lbl + ". Ketuk tombol + atau terima dari perangkat lain.";
    measure();
    refreshLabels();
  }

  function intro() {
    if (!rows.length) return;
    var k = listIdx.indexOf(index);
    var sel = k >= 0 ? k : 0;
    pos = sel - 2.8;
    updateRows();
    animateTo(sel, 1000);
  }

  /* ---------- sentuh ---------- */
  var passiveOK = false;
  try {
    var o = Object.defineProperty({}, "passive", { get: function () { passiveOK = true; } });
    window.addEventListener("t", null, o);
  } catch (e) {}
  var NP = passiveOK ? { passive: false } : false;

  function findUp(el, cls) {
    while (el && el !== document.body) {
      if (el.classList && el.classList.contains(cls)) return el;
      el = el.parentNode;
    }
    return null;
  }
  function rubber(v) {
    var max = rows.length - 1;
    if (v < 0) return v * 0.35;
    if (v > max) return max + (v - max) * 0.35;
    return v;
  }

  listEl.addEventListener("touchstart", function (e) {
    if (!rows.length) return;
    stopAnim();
    var t = e.touches[0];
    drag = { y: t.clientY, x: t.clientX, pos: pos, moved: false, target: e.target, s: [{ y: t.clientY, t: Date.now() }] };
  }, false);

  listEl.addEventListener("touchmove", function (e) {
    if (!drag) return;
    var t = e.touches[0], dy = t.clientY - drag.y;
    if (Math.abs(dy) > 6 || Math.abs(t.clientX - drag.x) > 6) drag.moved = true;
    if (drag.moved) {
      e.preventDefault();
      pos = rubber(drag.pos - dy / SP);
      updateRows();
      drag.s.push({ y: t.clientY, t: Date.now() });
      if (drag.s.length > 6) drag.s.shift();
    }
  }, NP);

  function endDrag(cancel) {
    if (!drag) return;
    var d = drag; drag = null;
    if (!d.moved && !cancel) { onTap(d.target); return; }
    var v = 0, s = d.s;
    if (s.length > 1) {
      var a = s[0], b = s[s.length - 1], dt = b.t - a.t;
      if (dt > 0 && Date.now() - b.t < 120) v = -(b.y - a.y) / dt / SP; // baris per ms
    }
    var target = clamp(Math.round(pos + clamp(v * 240, -4, 4)), 0, Math.max(0, rows.length - 1));
    animateTo(target);
  }
  listEl.addEventListener("touchend", function () { endDrag(false); }, false);
  listEl.addEventListener("touchcancel", function () { endDrag(true); }, false);

  function onTap(target) {
    var rowEl = findUp(target, "row");
    if (!rowEl) return;
    var k = parseInt(rowEl.getAttribute("data-k"), 10);
    if (k !== selK()) { animateTo(k); return; }
    var song = listIdx[k];
    if (kindOf(songs[song]) !== "audio") { openViewer(song); return; }
    queue = listIdx.filter(function (si) { return kindOf(songs[si]) === "audio"; });
    if (findUp(target, "play")) {
      if (index === song) { audio.paused ? play() : userPause(); }
      else load(song, true);
    } else {
      if (index !== song) load(song, true);
      openSheet();
    }
  }

  document.addEventListener("touchmove", function (e) {
    if (e.target !== seek && e.target !== vvVid) e.preventDefault();
  }, NP);

  /* ---------- layar ---------- */
  var tabs = document.querySelectorAll(".tab");
  function go(name) {
    if (name === screen) return;
    screen = name;
    landing.classList.toggle("hide", name !== "landing");
    explore.classList.toggle("show", name !== "landing");
    tabbar.classList.toggle("show", name !== "landing");
    closeMenu(); closeSheet(); updateA2hs();
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle("on", tabs[i].getAttribute("data-go") === name);
    }
    if (name !== "landing") {
      view = name === "saved" ? "saved" : "all";
      hdrTitle.textContent = view === "saved" ? "Tersimpan" : "Explore";
      buildList();
      intro();
    }
    updateUI();
  }

    if (!x.lastSp) { x.lastSp = now; x.lastB = bytes; return; }
    if (now - x.lastSp < 700) return;
    var sp = (bytes - x.lastB) / ((now - x.lastSp) / 1000);
    x.lastSp = now; x.lastB = bytes;
    xSet(verb + "... " + (sp / 1048576).toFixed(1) + " MB/s");
  }
  function xShow(title, text, mode) {
    xTitle.textContent = title; xText.textContent = text;
    xCode.style.display = mode === "recv" ? "block" : "none";
    xSend.style.display = mode === "send" ? "block" : "none";
    xProg.style.display = "none"; xBar.style.width = "0%";
    xSet(""); xClose.textContent = "Batal";
    xferEl.classList.add("on");
  }
  function xStop() {
    if (!xfer) return;
    var x = xfer;
    clearTimeout(x.t1); clearTimeout(x.t2);
    try { if (x.es) x.es.close(); } catch (e) {}
    try { if (x.dc) x.dc.close(); } catch (e) {}
    try { if (x.pc) x.pc.close(); } catch (e) {}
    x.es = null; x.dc = null; x.pc = null;
  }
  function xFail(msg) {
    if (!xfer || xfer.dead) return;
    xStop(); xfer.dead = true;
    xSet(msg); xClose.textContent = "Tutup";
  }
  function xCancel(msg) {
    xStop(); xfer = null;
    xferEl.classList.remove("on");

  xClose.addEventListener("click", function () { xCancel(); });

  function mkDesc(type, sdp) {
    return window.RTCSessionDescription ? new RTCSessionDescription({ type: type, sdp: sdp }) : { type: type, sdp: sdp };
  }
  function waitIce(pc) {
    return new Promise(function (res) {
      if (pc.iceGatheringState === "complete") { res(); return; }
      var done = false;
      function fin() { if (!done) { done = true; res(); } }
      pc.onicecandidate = function (e) { if (!e.candidate) fin(); };
      setTimeout(fin, 3500);
    });
  }
  function shrink(sdp) {
    if (sdp.length < 3000) return sdp;
    var lines = sdp.split("\r\n"), out = [];
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (l.indexOf("a=candidate") === 0) {
        var tk = l.split(" ");
        if (/tcp/i.test(tk[2] || "") || (tk[4] || "").indexOf(":") >= 0) continue;
      }
      out.push(l);
    }
    return out.join("\r\n");
  }
  function ntfyPost(topic, obj) {
    return fetch("https://ntfy.sh/" + topic, { method: "POST", body: JSON.stringify(obj) }).then(function (r) {
      if (!r.ok) throw new Error("ntfy");
    });
  }
  function ntfySub(topic, onMsg, onOpen) {
    var es = new EventSource("https://ntfy.sh/" + topic + "/sse");
    es.addEventListener("open", function () { if (onOpen) { var f = onOpen; onOpen = null; f(); } });
    es.addEventListener("message", function (e) {
      try {
        var m = JSON.parse(e.data);
        if (m.event && m.event !== "message") return;
        onMsg(JSON.parse(m.message));
      } catch (er) {}
    });
    return es;
  }

  /* --- penerima --- */
  function startReceive() {
    if (!window.RTCPeerConnection || !window.EventSource) { toast("Browser ini tidak mendukung WebRTC"); return; }
    if (!db) { toast("Penyimpanan di browser ini tidak tersedia"); return; }
    xCancel();
    var code = String(1000 + Math.floor(Math.random() * 9000));
    var x = xfer = { role: "recv", me: rid(), topic: "instalipa-xfer-" + code, chain: Promise.resolve(), newIdx: [], got: 0, total: 0, recvd: 0, flushed: 0 };
    xShow("Terima file", "Masukkan kode ini di perangkat pengirim. Kedua perangkat harus online. Biarkan layar tetap menyala.", "recv");
    xCode.textContent = code;
    xSet("Menunggu pengirim...");
    x.es = ntfySub(x.topic, function (o) { if (xfer === x && o.from !== x.me && o.t === "offer") onOffer(x, o); });
    x.t1 = setTimeout(function () { if (xfer === x && !x.pc) xFail("Kode kedaluwarsa. Tutup lalu coba lagi."); }, 180000);
  }

  function onOffer(x, o) {
    if (x.pc) return;
    clearTimeout(x.t1);
    xSet("Menghubungkan...");
    var pc = new RTCPeerConnection(ICE_CFG);
    x.pc = pc;
    pc.ondatachannel = function (e) { recvChannel(x, e.channel); };
    pc.oniceconnectionstatechange = function () { if (pc.iceConnectionState === "failed") xFail(FAIL_MSG); };
    x.t2 = setTimeout(function () { if (xfer === x && !x.open) xFail(FAIL_MSG); }, 30000);
    pc.setRemoteDescription(mkDesc("offer", o.sdp))
      .then(function () { return pc.createAnswer(); })
      .then(function (a) { return pc.setLocalDescription(a); })
      .then(function () { return waitIce(pc); })
      .then(function () { return ntfyPost(x.topic, { t: "answer", from: x.me, sdp: shrink(pc.localDescription.sdp) }); })
      .catch(function () { xFail("Gagal membuat koneksi."); });
  }

  function recvChannel(x, dc) {
    dc.binaryType = "arraybuffer";
    x.dc = dc;
    var cur = null;

    function enqueue(fn) {
      x.chain = x.chain.then(function () { if (x.err) return; return fn(); }).catch(function () {
        if (!x.err) {
          x.err = true;
          try { dc.send(JSON.stringify({ t: "err" })); } catch (er) {}
          setTimeout(function () { xFail("Penyimpanan penuh atau gagal menyimpan."); }, 300);
        }
      });
    }
    function flush(c) {
      if (!c || !c.buf.length) return;
      var blob = new Blob(c.buf, { type: c.type }), pi = c.parts++, size = c.bufBytes;
      c.buf = []; c.bufBytes = 0;
      enqueue(function () {
        return putPart(c.id, pi, blob).then(function () {
          x.flushed += size;
          try { dc.send(JSON.stringify({ t: "p", n: x.flushed })); } catch (er) {}
        });
      });
    }

    dc.onopen = function () { x.open = true; clearTimeout(x.t2); xSet("Terhubung. Menunggu daftar file..."); };
    dc.onclose = function () { if (xfer === x && !x.finished && !x.dead) xFail("Koneksi terputus."); };
    dc.onmessage = function (e) {
      if (typeof e.data === "string") {
        var m;
        try { m = JSON.parse(e.data); } catch (er) { return; }
        if (m.t === "hello") {
          var names = (m.names || []).slice(0, 5).join("\n");
          if (!confirm("Terima " + m.count + " file (" + fmtSize(m.total || 0) + ")?\n" + names)) {
            try { dc.send(JSON.stringify({ t: "no" })); } catch (er) {}
            setTimeout(function () { if (xfer === x) xCancel("Penerimaan ditolak"); }, 300);
            return;
          }
          x.total = m.total || 1;
          dc.send(JSON.stringify({ t: "ok" }));
          xSet("Menerima...");
        } else if (m.t === "file") {
          if (!m.size) { cur = null; return; }
          var kd = m.kind || detectKind(m.name, m.type) || "audio";
          cur = { id: newId(), name: m.name, type: m.type || guessType(m.name, kd), kind: kd, size: m.size, parts: 0, buf: [], bufBytes: 0 };
          xSet("Menerima: " + m.name);
        } else if (m.t === "end") {
          var c = cur; cur = null;
          if (c) {
            flush(c);
            enqueue(function () {
              return commitMeta(c.id, c.name, c.type, c.kind, c.parts, c.size).then(function (idx) { x.newIdx.push(idx); x.got++; });
            });
          }
        } else if (m.t === "done") {
          x.chain.then(function () {
            if (x.err) return;
            x.finished = true;
            try { dc.send(JSON.stringify({ t: "ack" })); } catch (er) {}
            xProgress(1); xSet(x.got + " file diterima");
            setTimeout(function () {
              var n = x.got, first = x.newIdx.length ? x.newIdx[0] : -1;
              if (xfer === x) xCancel();
              afterReceive(n, first, false);
            }, 900);
          });
        }
      } else if (cur) {
        cur.buf.push(e.data);
        cur.bufBytes += e.data.byteLength;
        x.recvd += e.data.byteLength;
        xProgress(x.recvd / x.total);
        xSpeed(x, x.recvd, "Menerima");
        if (cur.bufBytes >= PART) flush(cur);
      }
    };
  }

  function afterReceive(n, first, bad) {
    if (!n) { toast("Tidak ada file yang tersimpan"); return; }
    toast(n + " file diterima" + (bad ? " (sebagian gagal disimpan)" : ""));
    if (screen === "landing") go("explore"); else buildList();
    var k = listIdx.indexOf(first);
    if (k >= 0) { animateTo(k); prefetchLocal(k); }
    updateUI();
  }

  /* --- pengirim --- */
  function openSend() {
    if (!window.RTCPeerConnection || !window.EventSource) { toast("Browser ini tidak mendukung WebRTC"); return; }
    xCancel();
    sendFiles = [];
    xfer = { role: "send", me: rid() };
    xShow("Kirim file", "Pilih file (kualitas asli, tidak dikompres), lalu masukkan kode 4 angka dari perangkat penerima.", "send");
    xPicked.textContent = "Belum ada file dipilih";
    xCodeIn.value = "";
  }
  $("xPick").addEventListener("click", function () { sendPick.click(); });
  sendPick.addEventListener("change", function () {
    var fl = sendPick.files, tot = 0;
    sendFiles = [];
    for (var i = 0; i < fl.length; i++) {
      if (detectKind(fl[i].name, fl[i].type) && fl[i].size) { sendFiles.push(fl[i]); tot += fl[i].size; }
    }
    xPicked.textContent = sendFiles.length ? (sendFiles.length + " file (" + fmtSize(tot) + ")") : "Tidak ada file yang didukung";
    setTimeout(function () { sendPick.value = ""; }, 0);
  });
  $("xGo").addEventListener("click", startSend);

  function readSlice(f, a, b) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
      r.readAsArrayBuffer(f.slice(a, b));
    });
  }

  function startSend() {
    var x = xfer;
    if (!x || x.role !== "send" || x.pc) return;
    var code = xCodeIn.value.replace(/\D/g, "");
    if (!sendFiles.length) { xSet("Pilih file dulu."); return; }
    if (code.length !== 4) { xSet("Masukkan kode 4 angka."); return; }
    x.topic = "instalipa-xfer-" + code;
    xSend.style.display = "none";
    xSet("Menghubungkan...");
    var pc = new RTCPeerConnection(ICE_CFG), dc = pc.createDataChannel("f");
    dc.binaryType = "arraybuffer";
    x.pc = pc; x.dc = dc;
    pc.oniceconnectionstatechange = function () { if (pc.iceConnectionState === "failed") xFail(FAIL_MSG); };
    x.t2 = setTimeout(function () {
      if (xfer === x && !x.open) xFail("Tidak ada penerima dengan kode itu, atau koneksi gagal.");
    }, 30000);

    var opened = new Promise(function (res) {
      x.es = ntfySub(x.topic, function (o) {
        if (xfer !== x || o.from === x.me || o.t !== "answer" || x.answered) return;
        x.answered = true;
        pc.setRemoteDescription(mkDesc("answer", o.sdp)).catch(function () { xFail("Jawaban tidak valid."); });
      }, res);
    });
    var offer = pc.createOffer().then(function (d) { return pc.setLocalDescription(d); }).then(function () { return waitIce(pc); });
    Promise.all([opened, offer]).then(function () {
      return ntfyPost(x.topic, { t: "offer", from: x.me, sdp: shrink(pc.localDescription.sdp) });
    }).catch(function () { xFail("Gagal menghubungi server perantara."); });

    dc.onopen = function () {
      x.open = true; clearTimeout(x.t2);
      var total = 0, names = [];
      for (var i = 0; i < sendFiles.length; i++) { total += sendFiles[i].size; names.push(sendFiles[i].name); }
      x.total = total || 1; x.sent = 0; x.acked = 0;
      xSet("Terhubung. Menunggu persetujuan penerima...");
      dc.send(JSON.stringify({ t: "hello", count: sendFiles.length, total: total, names: names }));
    };
    dc.onclose = function () { if (xfer === x && !x.finished && !x.dead) xFail("Koneksi terputus."); };
    dc.onmessage = function (e) {
      if (typeof e.data !== "string") return;
      var m;
      try { m = JSON.parse(e.data); } catch (er) { return; }
      if (m.t === "ok") sendAll(x);
      else if (m.t === "p") x.acked = m.n;
      else if (m.t === "no") xFail("Penerima menolak.");
      else if (m.t === "err") xFail("Penyimpanan penerima penuh.");
      else if (m.t === "ack") { x.finished = true; xProgress(1); xSet("Terkirim \u2713"); xClose.textContent = "Selesai"; }
    };
  }

  function sendAll(x) {
    var dc = x.dc, i = 0, BIG = 262144;
    try { dc.bufferedAmountLowThreshold = 524288; } catch (e) {}
    xSet("Mengirim...");
    function alive() { return xfer === x && !x.dead; }
    function nextFile() {
      if (!alive()) return;
      if (i >= sendFiles.length) {
        try { dc.send(JSON.stringify({ t: "done" })); } catch (e) { xFail("Koneksi terputus."); return; }
        xSet("Menunggu penerima menyimpan...");
        return;
      }
      var f = sendFiles[i], kd = detectKind(f.name, f.type) || "audio";
      try { dc.send(JSON.stringify({ t: "file", name: f.name, type: f.type || guessType(f.name, kd), size: f.size, kind: kd })); }
      catch (e) { xFail("Koneksi terputus."); return; }
      chunks(f, 0, function () {
        try { dc.send(JSON.stringify({ t: "end" })); } catch (e) { xFail("Koneksi terputus."); return; }
        i++; nextFile();
      });
    }
    function waitDrain(cb) {
      var fired = false;
      function go() { if (fired) return; fired = true; dc.onbufferedamountlow = null; cb(); }
      dc.onbufferedamountlow = go;
      setTimeout(go, 50);
    }
    function chunks(f, off, done) {
      if (!alive()) return;
      if (off >= f.size) { done(); return; }
      if (x.sent - x.acked > WINDOW) { setTimeout(function () { chunks(f, off, done); }, 30); return; }
      var end = Math.min(off + BIG, f.size);
      readSlice(f, off, end).then(function (buf) {
        var p0 = 0;
        (function pump() {
          if (!alive()) return;
          while (p0 < buf.byteLength) {
            if (dc.bufferedAmount > 1048576) { waitDrain(pump); return; }
            var e2 = Math.min(p0 + CH, buf.byteLength);
            try { dc.send(buf.slice(p0, e2)); } catch (er) { xFail("Koneksi terputus."); return; }
            x.sent += e2 - p0; p0 = e2;
          }
          xProgress(x.sent / x.total);
          xSpeed(x, x.sent, "Mengirim");
          chunks(f, end, done);
        })();
      }).catch(function () { xFail("Gagal mengirim file."); });
    }
    nextFile();
  }

  $("mRecv").addEventListener("click", function () { closeMenu(); startReceive(); });
  $("mSend").addEventListener("click", function () { closeMenu(); openSend(); });

  /* ---------- simpan offline ---------- */
  function refreshSaved() {
    if (!hasCache) return;
    caches.open(CACHE).then(function (c) {
      return Promise.all(songs.map(function (s) {
        if (s.local) { saved[s.file] = true; return null; }
        return c.match(abs(s.file)).then(function (r) { saved[s.file] = !!r; });
      }));
    }).then(updateUI, updateUI);
  }
  bSave.addEventListener("click", function () {
    if (index < 0) return;
    if (songs[index].local) deleteLocal(index);
  });

  /* ---------- audio ---------- */
  function saveState() {
    try {
      if (index >= 0 && songs[index]) {
        localStorage.setItem("musik-last", JSON.stringify({ file: songs[index].file, t: audio.currentTime || 0 }));
      }
    } catch (e) {}
  }
  function setMediaSession(song) {
    if ("mediaSession" in navigator && window.MediaMetadata) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: song.title, artist: song.artist || "" });
    }
  }
  function load(i, autoplay) {
    if (i < 0 || i >= songs.length) return;
    index = i; resumeTime = 0; restoredAt = 0;
    var tok = ++loadToken, pending = false;
    if (songs[i].local) {
      if (urlCache[songs[i].id]) {
        audio.src = urlCache[songs[i].id];
      } else {
        pending = true;
        audio.pause();
        localUrl(songs[i]).then(function (u) {
          if (tok !== loadToken) return;
          audio.src = u;
          if (autoplay) play();
        }).catch(function () { toast("Lagu tidak ditemukan di perangkat"); });
      }
    } else {
      audio.src = encodeURI(songs[i].file);
    }
    setMediaSession(songs[i]);
    curEl.textContent = "0:00"; durEl.textContent = "0:00"; seek.value = 0; paintSeek(0);
    updateUI();
    if (screen !== "landing" && !drag) {
      var k = listIdx.indexOf(i);
      if (k >= 0) animateTo(k);
    }
    if (autoplay && !pending) play();
  }
  function play() {
    if (index < 0 && songs.length) { queue = allAudio(); if (queue.length) load(queue[0], true); return; }
    var p = audio.play();
    if (p && p.catch) p.catch(function () { toast("Ketuk putar untuk memulai"); });
  }
  function pause() { audio.pause(); }
  function userPause() { userPaused = true; audio.pause(); }

  function allAudio() {
    var o = [];
    for (var i = 0; i < songs.length; i++) if (kindOf(songs[i]) === "audio") o.push(i);
    return o;
  }
  function getQueue() {
    if (queue.indexOf(index) < 0) queue = allAudio();
    return queue;
  }
  function next(auto) {
    if (!songs.length) return;
    var q = getQueue(), p = q.indexOf(index), n;
    if (shuffle && q.length > 1) {
      do { n = Math.floor(Math.random() * q.length); } while (n === p);
    } else {
      n = p + 1;
      if (n >= q.length) {
        if (repeat > 0 || !auto) n = 0; else { updateUI(); return; }
      }
    }
    load(q[n], true);
  }
  function prev() {
    if (!songs.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    var q = getQueue(), p = q.indexOf(index);
    load(q[p <= 0 ? q.length - 1 : p - 1], true);
  }
  function toggleShuffle() { shuffle = !shuffle; updateUI(); }
  function toggleRepeat() {
    repeat = (repeat + 1) % 3;
    toast(repeat === 2 ? "Ulangi 1 lagu" : (repeat === 1 ? "Ulangi semua lagu" : "Ulangi mati"));
    updateUI();
  }

  bPlay.addEventListener("click", function () { audio.paused ? play() : userPause(); });
  $("bNext").addEventListener("click", function () { next(false); });
  $("bPrev").addEventListener("click", prev);
  bShuffle.addEventListener("click", toggleShuffle);
  bRepeat.addEventListener("click", toggleRepeat);

  function paintSeek(p) {
    seek.style.background = "linear-gradient(to right,#111 " + p + "%,#d8dbec " + p + "%)";
  }

  audio.addEventListener("play", function () { userPaused = false; restoredAt = 0; updateUI(); });
  audio.addEventListener("pause", updateUI);
  audio.addEventListener("playing", function () { wasPlaying = true; });
  audio.addEventListener("ended", function () {
    wasPlaying = false;
    if (repeat === 2 || (repeat === 1 && !shuffle && getQueue().length === 1)) { audio.currentTime = 0; play(); }
    else next(true);
  });
  audio.addEventListener("loadedmetadata", function () {
    durEl.textContent = fmt(audio.duration);
    if (resumeTime > 0 && resumeTime < audio.duration) { try { audio.currentTime = resumeTime; } catch (e) {} }
    resumeTime = 0;
  });
  audio.addEventListener("timeupdate", function () {
    curEl.textContent = fmt(audio.currentTime);
    if (!dragging && audio.duration) {
      var p = (audio.currentTime / audio.duration) * 100;
      seek.value = p; paintSeek(p);

    if (now - lastSave > 2000) { lastSave = now; saveState(); }

  audio.addEventListener("error", function () {
    toast(navigator.onLine ? "File tidak bisa diputar" : "Lagu ini belum disimpan offline");
  });

  seek.addEventListener("touchstart", function () { dragging = true; });
  seek.addEventListener("mousedown", function () { dragging = true; });
  seek.addEventListener("input", function () { paintSeek(seek.value); });
  seek.addEventListener("change", function () {
    if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
    dragging = false;
  });
  seek.addEventListener("touchend", function () { dragging = false; });

  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.setActionHandler("play", play);
      navigator.mediaSession.setActionHandler("pause", userPause);
      navigator.mediaSession.setActionHandler("previoustrack", prev);
      navigator.mediaSession.setActionHandler("nexttrack", function () { next(false); });

  }

  /* lanjut otomatis saat halaman kembali tampil */
  function tryResume() {
    if (index >= 0 && !userPaused && audio.paused && audio.src && wasPlaying) play();
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) saveState(); else tryResume();
  });
  window.addEventListener("pagehide", saveState);
  window.addEventListener("pageshow", function (e) { if (e.persisted) tryResume(); });
  window.addEventListener("resize", function () { measure(); updateRows(); });
  window.addEventListener("orientationchange", function () { setTimeout(function () { measure(); updateRows(); }, 300); });

  /* ---------- service worker (offline & update otomatis) ---------- */
  if (hasCache) {
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      reg.update();
      document.addEventListener("visibilitychange", function () { if (!document.hidden) reg.update(); });

  /* ---------- muat daftar lagu ---------- */
  updateUI();
  updateA2hs();
  /* ---------- muat lagu dari perangkat (IndexedDB) ---------- */
  (function () {
    if (screen !== "landing") { buildList(); intro(); }
    refreshSaved();

    // lagu hasil impor (tidak memblokir kalau IndexedDB lambat)
    idbOpen().then(function () { return idbAll("meta"); }).then(function (metas) {
      if (!metas.length) return;
      metas.sort(function (a, b) { return a.added - b.added; });
      metas.forEach(function (m) { var s = localSong(m); songs.push(s); saved[s.file] = true; });
      try {
        var last2 = JSON.parse(localStorage.getItem("musik-last") || "null");
        if (last2 && index < 0 && /^local:/.test(last2.file)) {
          for (var q = 0; q < songs.length; q++) {
            if (songs[q].file === last2.file && kindOf(songs[q]) === "audio") {
              load(q, false);
              resumeTime = last2.t || 0; restoredAt = resumeTime;
              updateUI();
              break;
            }
          }
        }
      } catch (e) {}
      if (screen !== "landing") {
        buildList();
        pos = clamp(pos, 0, Math.max(0, rows.length - 1)); updateRows();
      }
    }).catch(function () {});
  })();
})();
</script>
