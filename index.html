<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install App</title>
<style>
  :root { --bg:#f2f2f7; --fg:#111; --card:#fff; --btn:#007aff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --fg:#f5f5f5; --card:#1c1c1e; --btn:#0a84ff; }
  }
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:-apple-system,Helvetica,sans-serif; }
  .card { background:var(--card); padding:32px 24px; border-radius:18px; text-align:center; width:80%; max-width:320px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { font-size:14px; opacity:.7; margin:0 0 24px; }
  a.btn { display:block; padding:14px; background:var(--btn); color:#fff; text-decoration:none;
          border-radius:12px; font-weight:600; font-size:17px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Nama App</h1>
    <p>Ketuk tombol, lalu pilih "Pasang" / "Install".</p>
    <a class="btn" id="install" href="#">Install</a>
  </div>

<script>
  // GANTI dua nilai ini
  var USERNAME = "USERNAME";
  var REPO = "instalipa";

  var manifest = "https://" + USERNAME + ".github.io/" + REPO + "/manifest.plist";
  var link = "itms-services://?action=download-manifest&url=" + encodeURIComponent(manifest);
  document.getElementById("install").href = link;

  // Coba otomatis; jika diblokir Safari, tombol tetap bisa diketuk
  if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
    setTimeout(function () { window.location.href = link; }, 500);
  }
</script>
</body>
</html>
