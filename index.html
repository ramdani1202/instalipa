<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Musik">
<meta name="theme-color" content="#e6e8f6">
<title>Musik</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #e6e8f6; }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
         color: #111; -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
  button { font-family: inherit; cursor: pointer; outline: none; }
  svg { width: 100%; height: 100%; display: block; }

  .bg { position: fixed; left: 0; top: 0; right: 0; bottom: 0;
        background: linear-gradient(160deg, #e3e8f8 0%, #ebe6f8 55%, #e2e6f6 100%); }
  .app { position: fixed; left: 0; top: 0; right: 0; bottom: 0; padding: 12px; }
  .card { position: relative; width: 100%; height: 100%; border-radius: 34px; overflow: hidden;
          background: linear-gradient(180deg, #f8faff 0%, #eef1fb 100%);
          box-shadow: 0 24px 60px rgba(110,110,180,.25), inset 0 1px 0 rgba(255,255,255,.9);
          -webkit-mask-image: -webkit-radial-gradient(white, black); }
  .card:before { content: ""; position: absolute; left: -45%; top: 28%; width: 130%; height: 52%;
          background: radial-gradient(closest-side, rgba(255,224,182,.5), rgba(255,224,182,0));
          pointer-events: none; }

  .screen { position: absolute; left: 0; top: 0; right: 0; bottom: 0;
            transition: transform .7s cubic-bezier(.4,0,.2,1), opacity .6s ease; }

  /* ---------- LANDING ---------- */
  #landing.hide { transform: translate3d(0,-7%,0); opacity: 0; pointer-events: none; }
  #landing.hide * { animation-play-state: paused !important; }

  .discs { position: absolute; left: 0; right: 0; top: 24px; height: 140px; }
  .disc { position: absolute; top: 0; width: 132px; height: 132px; border-radius: 50%;
          box-shadow: 0 10px 26px rgba(110,115,170,.22), inset 0 0 0 1px rgba(255,255,255,.9); }
  .disc.d1 { left: 28px; z-index: 1;
          background: radial-gradient(circle, #fff 0, #fff 12%, rgba(255,255,255,0) 13%),
                      repeating-radial-gradient(circle, rgba(228,232,243,.96) 0, rgba(244,246,251,.96) 3px, rgba(224,228,241,.96) 6px);
          animation: slideL .9s .05s cubic-bezier(.2,.8,.2,1) both, floatY 6.5s 1s ease-in-out infinite; }
  .disc.d2 { left: 112px; z-index: 2;
          background: radial-gradient(circle, #fff 0, #fff 12%, rgba(255,255,255,0) 13%),
                      repeating-radial-gradient(circle, rgba(232,236,246,.97) 0, rgba(246,247,252,.97) 3px, rgba(226,230,243,.97) 6px);
          animation: slideL .9s .2s cubic-bezier(.2,.8,.2,1) both, floatY2 7s 1.1s ease-in-out infinite; }
  .disc.d3 { left: 196px; z-index: 3; overflow: hidden;
          background: radial-gradient(circle, #fff 0, #fff 7%, #c8cde3 8%, #c8cde3 10%, rgba(255,255,255,0) 11%),
                      repeating-radial-gradient(circle, #e9ecf5 0, #cfd5ec 2px, #f6eefb 4px, #d6e6f3 7px);
          animation: slideL .9s .35s cubic-bezier(.2,.8,.2,1) both, floatY 7.5s 1.2s ease-in-out infinite; }
  .disc.d3 .sheen { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 50%;
          background: linear-gradient(115deg, rgba(255,255,255,0) 18%, rgba(255,255,255,.9) 40%,
                      rgba(130,200,255,.35) 50%, rgba(255,160,220,.32) 60%, rgba(255,255,255,0) 82%);
          animation: spin 9s linear infinite; }
  .disc .lbl { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px;
          border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(200,205,225,.7); }
  .disc .lbl:before, .disc .lbl:after { content: ""; position: absolute; left: 9px; right: 9px; height: 2px;
          background: #c7cbdc; border-radius: 1px; }
  .disc .lbl:before { top: 14px; } .disc .lbl:after { top: 19px; right: 14px; }
  .disc.d3 .lbl { display: none; }

  .cs-wrap { position: absolute; left: 47%; top: 43%; width: 235px; height: 142px;
             animation: slideIn 1s .45s cubic-bezier(.2,.8,.2,1) both; }
  .cassette { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 12px;
              background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(226,231,246,.85));
              border: 1px solid rgba(255,255,255,.95);
              box-shadow: 0 16px 34px rgba(120,125,185,.28);
              -webkit-mask-image: -webkit-linear-gradient(left, #000 42%, rgba(0,0,0,0) 100%);
              animation: floatY 6s 1.4s ease-in-out infinite; }
  .cs-top { position: absolute; left: 12px; right: 12px; top: 12px; height: 28px; border-radius: 4px;
            background: rgba(255,255,255,.85); display: flex; align-items: center; padding: 0 9px;
            font-size: 9px; color: #666; letter-spacing: .3px; }
  .cs-top b { font-size: 17px; color: #111; margin-right: 8px; }
  .cs-win { position: absolute; left: 44px; right: 44px; top: 52px; height: 56px; border-radius: 28px;
            background: rgba(200,207,229,.6); box-shadow: inset 0 2px 6px rgba(120,125,170,.25); }
  .reel { position: absolute; top: 6px; width: 44px; height: 44px; border-radius: 50%;
          background: #e9ecf6; border: 7px dotted #fff; animation: spin 4s linear infinite; }
  .reel.r1 { left: 8px; } .reel.r2 { right: 8px; }
  .cs-90 { position: absolute; left: 16px; bottom: 12px; width: 24px; height: 24px; border-radius: 50%;
           border: 1px solid #b9bdd0; font-size: 9px; text-align: center; line-height: 22px; color: #666; background: #fff; }

  .hero { position: absolute; left: 26px; bottom: 98px; font-size: 42px; line-height: 1.06; font-weight: 800;
          letter-spacing: -1.4px; }
  .hero span { display: block; opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) forwards; }
  .hero span:nth-child(1) { animation-delay: .35s; }
  .hero span:nth-child(2) { animation-delay: .5s; color: #9c9eab; }
  .hero span:nth-child(3) { animation-delay: .65s; }
  #start { position: absolute; left: 16px; right: 16px; bottom: 22px; height: 52px; border: 0; border-radius: 26px;
           font-size: 16px; font-weight: 700; color: #111;
           background: linear-gradient(180deg, #fff, #eef0f9);
           box-shadow: 0 8px 22px rgba(110,115,175,.28), inset 0 0 0 1px rgba(255,255,255,.95);
           opacity: 0; animation: up .8s .85s cubic-bezier(.2,.8,.2,1) forwards; }
  #start:active { -webkit-transform: scale(.98); transform: scale(.98); }

  /* ---------- EXPLORE ---------- */
  #explore { opacity: 0; transform: translate3d(0,5%,0); pointer-events: none; }
  #explore.show { opacity: 1; transform: none; pointer-events: auto; }
  .hdr { position: absolute; left: 0; right: 0; top: 0; height: 68px; display: flex; align-items: center;
         justify-content: space-between; padding: 6px 18px 0 24px; z-index: 5; }
  .hdr h2 { margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -.5px; }
  #net { display: none; margin-left: 10px; font-size: 11px; font-weight: 600; color: #8d8fa0;
         background: #e6e8f4; border-radius: 9px; padding: 3px 8px; vertical-align: 3px; }
  #net.on { display: inline-block; }
  #menuBtn { width: 38px; height: 38px; padding: 7px; border: 0; background: none; color: #111; }

  #list { position: absolute; left: 0; right: 0; top: 68px; bottom: 74px; overflow: hidden; }
  #rows { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  .fade-t, .fade-b { position: absolute; left: 0; right: 0; height: 46px; pointer-events: none; z-index: 3; }
  .fade-t { top: 0; background: linear-gradient(to bottom, rgba(246,248,254,.95), rgba(246,248,254,0)); }
  .fade-b { bottom: 0; background: linear-gradient(to top, rgba(242,244,252,.95), rgba(242,244,252,0)); }
  #empty { position: absolute; left: 30px; right: 30px; top: 40%; text-align: center; color: #8d8fa0;
           font-size: 14px; line-height: 1.5; display: none; }

  .row { position: absolute; left: 0; top: 0; width: 100%; height: 72px; will-change: transform; }
  .pill { position: absolute; left: 10px; right: 10px; top: 0; bottom: 0; border-radius: 36px; background: #fff;
          box-shadow: 0 10px 28px rgba(110,115,175,.2), inset 0 0 0 1px rgba(255,255,255,.9); opacity: 0; }
  .grp { position: absolute; left: 24px; top: 0; height: 72px; display: flex; align-items: center;
         -webkit-transform-origin: 0 50%; transform-origin: 0 50%; will-change: transform, opacity; }
  .cover { width: 56px; height: 56px; border-radius: 50%; flex: none; display: flex; align-items: center;
           justify-content: center; font-size: 22px; font-weight: 800; color: #fff; background-color: #888;
           box-shadow: 0 5px 14px rgba(70,70,120,.28), inset 0 0 0 2px rgba(255,255,255,.35); }
  .txt { margin-left: 14px; max-width: 150px; -webkit-transform-origin: 0 50%; transform-origin: 0 50%; }
  .t { font-size: 17px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; overflow: hidden;
       text-overflow: ellipsis; }
  .a { font-size: 13px; color: #8d8fa0; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .play { position: absolute; right: 22px; top: 19px; height: 34px; padding: 0 17px; border: 0; border-radius: 17px;
          background: linear-gradient(180deg, #fff, #eef0f8); font-size: 13px; font-weight: 600; color: #111;
          box-shadow: 0 3px 8px rgba(110,115,175,.28), inset 0 0 0 1px rgba(255,255,255,.95); opacity: 0; }

  /* ---------- TAB BAR & MINI PLAYER ---------- */
  #tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; display: flex; z-index: 10;
            background: linear-gradient(to top, #f3f5fd 62%, rgba(243,245,253,0));
            opacity: 0; transform: translate3d(0,100%,0); pointer-events: none;
            transition: transform .6s cubic-bezier(.2,.8,.2,1), opacity .5s; }
  #tabbar.show { opacity: 1; transform: none; pointer-events: auto; }
  .tab { flex: 1; border: 0; background: none; color: #a0a2b3; padding: 22px 0 0; transition: color .25s; }
  .tab i { display: block; width: 26px; height: 26px; margin: 0 auto; transition: transform .25s; }
  .tab.on { color: #111; } .tab.on i { transform: scale(1.12); }

  #mini { position: absolute; left: 14px; right: 14px; bottom: 80px; height: 58px; border-radius: 29px; z-index: 12;
          background: #fff; display: flex; align-items: center; padding: 0 8px;
          box-shadow: 0 12px 30px rgba(100,105,170,.28);
          transform: translate3d(0,180%,0); opacity: 0; pointer-events: none;
          transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .35s; }
  #mini.on { transform: none; opacity: 1; pointer-events: auto; }
  #miniCover { width: 42px; height: 42px; border-radius: 50%; flex: none; font-size: 17px; }
  #miniInfo { flex: 1; min-width: 0; margin-left: 12px; }
  #miniTitle { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #miniSub { font-size: 12px; color: #8d8fa0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  #miniBtn { width: 42px; height: 42px; border: 0; border-radius: 50%; background: #111; color: #fff; padding: 11px;
             flex: none; }

  /* ---------- NOW PLAYING ---------- */
  #sheet { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 30;
           background: linear-gradient(180deg, #f8faff 0%, #eceff9 100%);
           transform: translate3d(0,102%,0); transition: transform .55s cubic-bezier(.2,.8,.2,1); }
  #sheet.open { transform: none; }
  .sbar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 6px 14px 0; }
  .sbar span { font-size: 13px; font-weight: 600; color: #8d8fa0; letter-spacing: .3px; }
  #sheetClose { width: 40px; height: 40px; padding: 8px; border: 0; background: none; color: #111; }
  .sbar i { width: 40px; display: block; }
  .vinyl { position: relative; width: 236px; height: 236px; border-radius: 50%; margin: 6px auto 0; background: #121214;
           box-shadow: 0 26px 50px rgba(80,85,150,.35); animation: spin 14s linear infinite; animation-play-state: paused; }
  .vinyl.playing { animation-play-state: running; }
  .vinyl .grv { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 50%;
                background: repeating-radial-gradient(circle, rgba(255,255,255,.07) 0, rgba(255,255,255,.07) 1px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 4px); }
  .vinyl .shn { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 50%;
                background: linear-gradient(120deg, rgba(255,255,255,.22) 0, rgba(255,255,255,0) 28%, rgba(255,255,255,0) 62%, rgba(255,255,255,.14) 100%); }
  #vLab { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 800; color: #fff;
          box-shadow: 0 0 0 4px rgba(255,255,255,.12); }
  .vinyl .hole { position: absolute; left: 50%; top: 50%; width: 11px; height: 11px; margin: -5px 0 0 -5px;
                 border-radius: 50%; background: #eef1fb; }
  #sTitle { text-align: center; font-size: 24px; font-weight: 800; letter-spacing: -.5px; margin: 26px 28px 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sArtist { text-align: center; font-size: 15px; color: #8d8fa0; min-height: 20px; }
  .seekrow { display: flex; align-items: center; margin: 22px 26px 0; font-size: 12px; color: #8d8fa0; }
  .seekrow span { width: 38px; text-align: center; }
  #seek { -webkit-appearance: none; appearance: none; flex: 1; height: 5px; border-radius: 3px; background: #d8dbec;
          outline: none; margin: 0; }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%; background: #111;
          box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .ctrls { display: flex; align-items: center; justify-content: center; margin-top: 20px; }
  .ctrls button { border: 0; background: none; color: #111; width: 50px; height: 50px; padding: 13px; margin: 0 5px; }
  .ctrls button.sm { color: #a0a2b3; width: 44px; height: 44px; padding: 11px; }
  .ctrls button.sm.on { color: #ff375f; }
  .ctrls button#bPlay { width: 72px; height: 72px; padding: 20px; background: #111; color: #fff; border-radius: 50%;
          box-shadow: 0 12px 26px rgba(20,20,40,.35); }
  .ctrls button:active { opacity: .7; }
  #bSave { display: flex; align-items: center; justify-content: center; margin: 22px auto 0; height: 40px; padding: 0 18px;
           border: 0; border-radius: 20px; background: #fff; color: #111; font-size: 13px; font-weight: 600;
           box-shadow: 0 6px 16px rgba(110,115,175,.25); }
  #bSave i { width: 18px; height: 18px; margin-right: 7px; display: block; }
  #bSave.saved { color: #1fa84f; } #bSave.busy { opacity: .55; }
  #saveNote { text-align: center; font-size: 11px; color: #a0a2b3; margin-top: 8px; min-height: 14px; }

  /* ---------- MENU & TOAST ---------- */
  #menuWrap { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 40; display: none; }
  #menuWrap.on { display: block; }
  #menu { position: absolute; right: 14px; top: 60px; width: 220px; background: #fff; border-radius: 18px; padding: 6px 0;
          box-shadow: 0 16px 40px rgba(90,95,160,.35); -webkit-transform-origin: 100% 0; transform-origin: 100% 0;
          animation: pop .25s cubic-bezier(.2,.8,.2,1); }
  #menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 13px 18px;
                 font-size: 15px; font-weight: 500; color: #111; }
  #menu button:active { background: #f0f2fa; }
  #toast { position: absolute; left: 24px; right: 24px; bottom: 150px; z-index: 50; text-align: center; font-size: 13px;
           color: #fff; background: rgba(20,20,30,.86); border-radius: 16px; padding: 10px 14px;
           opacity: 0; transform: translate3d(0,12px,0); pointer-events: none; transition: opacity .3s, transform .3s; }
  #toast.on { opacity: 1; transform: none; }

  @keyframes up { from { opacity: 0; transform: translate3d(0,22px,0); } to { opacity: 1; transform: none; } }
  @keyframes slideL { from { opacity: 0; transform: translate3d(-50px,0,0) rotate(-50deg); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translate3d(70px,0,0); } to { opacity: 1; transform: none; } }
  @keyframes floatY { 0%, 100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(0,-8px,0); } }
  @keyframes floatY2 { 0%, 100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(0,7px,0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="bg"></div>
<div class="app">
<div class="card">

  <!-- LANDING -->
  <section class="screen" id="landing">
    <div class="discs">
      <div class="disc d1"><div class="lbl"></div></div>
      <div class="disc d2"><div class="lbl"></div></div>
      <div class="disc d3"><div class="sheen"></div></div>
    </div>
    <div class="cs-wrap">
      <div class="cassette">
        <div class="cs-top"><b>B</b>TYPE I / IEC I NORMAL</div>
        <div class="cs-win"><div class="reel r1"></div><div class="reel r2"></div></div>
        <div class="cs-90">90</div>
      </div>
    </div>
    <div class="hero"><span>New</span><span>Age Of</span><span>Music</span></div>
    <button id="start">Get Started</button>
  </section>

  <!-- EXPLORE -->
  <section class="screen" id="explore">
    <div class="hdr">
      <div><h2 id="hdrTitle" style="display:inline-block">Explore</h2><span id="net">Offline</span></div>
      <button id="menuBtn" data-icon="dots" aria-label="Menu"></button>
    </div>
    <div id="list">
      <div id="rows"></div>
      <div class="fade-t"></div><div class="fade-b"></div>
      <div id="empty"></div>
    </div>
  </section>

  <div id="tabbar">
    <button class="tab" data-go="landing"><i data-icon="home"></i></button>
    <button class="tab on" data-go="explore"><i data-icon="planet"></i></button>
    <button class="tab" data-go="saved"><i data-icon="mark"></i></button>
  </div>

  <div id="mini">
    <div class="cover" id="miniCover"></div>
    <div id="miniInfo"><div id="miniTitle"></div><div id="miniSub"></div></div>
    <button id="miniBtn" aria-label="Putar"></button>
  </div>

  <div id="sheet">
    <div class="sbar">
      <button id="sheetClose" data-icon="down" aria-label="Tutup"></button>
      <span>SEDANG DIPUTAR</span>
      <i></i>
    </div>
    <div class="vinyl" id="vinyl">
      <div class="grv"></div><div id="vLab"></div><div class="hole"></div><div class="shn"></div>
    </div>
    <div id="sTitle">-</div>
    <div id="sArtist">&nbsp;</div>
    <div class="seekrow">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span id="dur">0:00</span>
    </div>
    <div class="ctrls">
      <button class="sm" id="bShuffle" data-icon="shuffle" aria-label="Acak"></button>
      <button id="bPrev" data-icon="prev" aria-label="Sebelumnya"></button>
      <button id="bPlay" aria-label="Putar"></button>
      <button id="bNext" data-icon="next" aria-label="Berikutnya"></button>
      <button class="sm" id="bRepeat" data-icon="repeat" aria-label="Ulangi"></button>
    </div>
    <button id="bSave"><i></i><b id="bSaveTxt" style="font-weight:600">Simpan offline</b></button>
    <div id="saveNote"></div>
  </div>

  <div id="menuWrap">
    <div id="menu">
      <button id="mSaveAll">Simpan semua offline</button>
      <button id="mShuffle">Acak: mati</button>
      <button id="mRepeat">Ulangi: mati</button>
    </div>
  </div>

  <div id="toast"></div>
</div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function () {
  "use strict";

  var CACHE = "musik-v1";
  var hasCache = !!(window.caches && "serviceWorker" in navigator);
  var SP = 80; // jarak antar baris (px)

  function $(id) { return document.getElementById(id); }

  /* ---------- ikon ---------- */
  function S(inner) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>'; }
  function F(inner) { return '<svg viewBox="0 0 24 24" fill="currentColor">' + inner + '</svg>'; }
  var ICON = {
    play: F('<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>'),
    pause: F('<rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/>'),
    next: F('<path d="M5 6.2v11.6a.8.8 0 0 0 1.25.66l8.4-5.8a.8.8 0 0 0 0-1.32l-8.4-5.8A.8.8 0 0 0 5 6.2z"/><rect x="16.5" y="5" width="2.6" height="14" rx="1.1"/>'),

      if (last) {
        for (var k = 0; k < songs.length; k++) {
          if (songs[k].file === last.file) {
            load(k, false);
            resumeTime = last.t || 0;
            restoredAt = resumeTime;
            updateUI();
            break;
          }
        }
      }
    } catch (e) {}
    if (screen !== "landing") { buildList(); intro(); }
    refreshSaved();
  };
  xhr.send();
})();
</script>
